<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Arduino - Brochage des cartes - FrWA Conception</title>
    <meta name="description" content="Brochage interactif des cartes Arduino : Uno R3, Nano, Leonardo (32U4), Mega 2560, GIGA R1 WiFi, Uno R4 Minima et Uno R4 WiFi (matrice LED) : fonctions, pull-up / pull-down, niveaux 3,3 V / 5 V.">
    <meta name="tags" content="Électronique, Microcontrôleur, Arduino">
</head>
<body>
    <div class="page-content">
        <!-- Bannière (texte rempli par le script depuis CONFIG.text) -->
        <div class="page-banner mm-banner">
            <div class="page-banner-overlay">
                <h1 class="page-banner-title" data-cfg="title"></h1>
                <span class="page-banner-subtitle" data-cfg="subtitle"></span>
            </div>
        </div>

        <!-- Tags (CONFIG.badges) -->
        <div class="flex gap-sm" style="margin-bottom: var(--spacing-lg);" id="mm-badges"></div>

        <p class="lead" data-cfg="lead"></p>

        <div class="divider"></div>

        <div class="card mm-picker">
            <div class="card-header"><h3 class="card-title">Choisir la carte</h3></div>
            <div class="card-body">
                <div class="mm-chips" id="mm-boards"></div>
                <div class="mm-picker-note">Le brochage s'adapte à la carte choisie ; l'adresse de la page garde la sélection (<code>#uno-r3</code>, <code>#giga-r1-wifi</code>…).</div>
            </div>
        </div>

        <div id="mm-root" class="mm-root">

            <!-- Filtres -->
            <div class="card mm-filters">
                <div class="card-body">
                    <input type="search" id="mm-search" class="mm-search" placeholder="" aria-label="Rechercher une broche">
                    <div class="mm-chips" id="mm-chips"></div>
                    <div class="mm-count" id="mm-count"></div>
                </div>
            </div>

            <!-- Schéma -->
            <div class="card">
                <div class="card-header"><h3 class="card-title">Schéma de la carte</h3></div>
                <div class="card-body">
                    <div class="mm-view" id="mm-view">
                        <div class="mm-side mm-side-left">
                            <div class="mm-side-title" data-cfg="sideLeft"></div>
                            <div class="mm-rows" id="mm-left"></div>
                        </div>
                        <div class="mm-boardcol" aria-hidden="true" id="mm-boardsvg"></div>
                        <div class="mm-side mm-side-right">
                            <div class="mm-side-title" data-cfg="sideRight"></div>
                            <div class="mm-rows" id="mm-right"></div>
                        </div>
                    </div>

                    <div class="mm-aux" id="mm-aux"></div>

                    <div class="mm-hint" data-cfg="hint"></div>
                    <div class="mm-legend" id="mm-legend"></div>
                </div>
            </div>

            <!-- Détail -->
            <div class="card" id="mm-detail-card">
                <div class="card-header"><h3 class="card-title">Détail de la broche</h3></div>
                <div class="card-body" id="mm-detail">
                    <p class="text-muted" style="margin:0;">Sélectionne une broche dans le schéma ou dans le tableau.</p>
                </div>
            </div>

            <!-- Tableau -->
            <div class="card">
                <div class="card-header"><h3 class="card-title">Toutes les broches</h3></div>
                <div class="card-body">
                    <div class="mm-table-wrap">
                        <table class="mm-table">
                            <thead>
                                <tr>
                                    <th>Carte</th><th>Rangée</th><th>Alias</th><th>Port</th>
                                    <th>Fonctions</th><th>Pull interne</th><th>Niveau</th>
                                </tr>
                            </thead>
                            <tbody id="mm-tbody"></tbody>
                        </table>
                    </div>
                    <p class="mm-foot" data-cfg="foot"></p>
                </div>
            </div>

            <!-- Les encadrés CONFIG.cards sont ajoutés ici par le script -->
        </div>

        <p class="text-center">
            <a data-retour class="btn btn-primary"></a>
        </p>

    <!-- Styles spécifiques à cette page — PARTIE FIXE (identique au gabarit, plus sélecteur de carte) -->
    <style>
        .mm-banner { background: var(--bg-tertiary, #1a2424); }

        .mm-root > .card,
        .mm-root > .card-alert { margin-bottom: var(--spacing-lg, 24px); }
        .mm-root .card-alert ul { margin: var(--spacing-sm, 8px) 0 0; padding-left: var(--spacing-lg, 24px); }

        /* ----- Filtres ----- */
        .mm-search {
            width: 100%;
            padding: var(--spacing-sm, 8px) var(--spacing-md, 16px);
            background: var(--bg-tertiary, #1a2424);
            border: 1px solid var(--color-primary, #2d5a5a);
            border-radius: var(--border-radius-md, 8px);
            color: var(--text-primary, #e8f0f0);
            font-family: var(--font-family-mono, monospace);
            font-size: var(--font-size-sm, 0.875rem);
        }
        .mm-chips { display: flex; flex-wrap: wrap; gap: var(--spacing-xs, 4px); margin-top: var(--spacing-md, 16px); }
        .mm-chip-btn {
            padding: 4px 12px;
            border: 1px solid var(--color-primary, #2d5a5a);
            border-radius: 999px;
            background: transparent;
            color: var(--text-secondary, #a8b5b5);
            font-size: var(--font-size-xs, 0.75rem);
            cursor: pointer;
            transition: all var(--transition-fast, 150ms ease);
        }
        .mm-chip-btn:hover { color: var(--text-primary, #e8f0f0); border-color: var(--text-accent, #4ecdc4); }
        .mm-chip-btn.active { background: var(--color-primary, #2d5a5a); color: #fff; border-color: var(--text-accent, #4ecdc4); }
        .mm-count { margin-top: var(--spacing-sm, 8px); font-size: var(--font-size-xs, 0.75rem); color: var(--text-muted, #6a7a7a); }

        /* ----- Éléments de rangée ----- */
        .mm-lv {
            display: inline-flex; align-items: center; justify-content: center;
            width: 20px; height: 20px; flex-shrink: 0;
            border-radius: 3px;
            font: 700 12px var(--font-family-mono, monospace);
            font-style: normal;
        }
        .mm-lv5 { background: #2ecc71; color: #05210f; }
        .mm-lv3 { background: #e74c3c; color: #fff; }
        .mm-lv0 { background: transparent; }
        .mm-inl { vertical-align: middle; margin: 0 2px; }

        .mm-pt {
            display: inline-flex; align-items: center; justify-content: center;
            min-width: 52px; height: 22px; padding: 0 6px; flex-shrink: 0;
            border-radius: 3px;
            font: 700 11px var(--font-family-mono, monospace);
            color: #fff;
            background: #2a6fb0;
        }
        .mm-side-left .mm-pt.io { background: #6b7d3a; }
        .mm-pt.io { background: #2a6fb0; }
        .mm-pt.pwr { background: #c0392b; }
        .mm-pt.gnd { background: #222; border: 1px solid #555; }
        .mm-pt.bat, .mm-pt.rst { background: #1f4fd8; }

        .mm-cs { display: flex; align-items: center; gap: 4px; min-width: 0; flex-shrink: 1; }
        .mm-view:not(.mm-stack) .mm-cs { overflow: hidden; }
        .mm-c {
            display: inline-flex; align-items: center;
            height: 20px; padding: 0 6px;
            border-radius: 4px; border: 1px solid transparent;
            font: 600 10.5px var(--font-family-primary, sans-serif);
            white-space: nowrap; color: #111;
        }
        .mm-c-al   { background: transparent; color: var(--text-secondary, #a8b5b5); border-color: var(--text-muted, #6a7a7a); font-style: italic; }
        .mm-c-ser  { background: #f5d76e; }
        .mm-c-i2c  { background: #f0a030; }
        .mm-c-spi  { background: #8e5bd0; color: #fff; }
        .mm-c-pwm  { background: #5b3a99; color: #fff; }
        .mm-c-an   { background: #f4d6c0; }
        .mm-c-usb  { background: #ff8c3a; }
        .mm-c-dbg  { background: #a8e6a1; }
        .mm-c-boot { background: #bfe3ff; }
        .mm-c-btn  { background: #1f4fd8; color: #fff; }
        .mm-c-misc { background: #cfd8dc; }
        .mm-rm { border: 1px dashed rgba(0, 0, 0, 0.7); opacity: 0.85; }
        .mm-c-spi.mm-rm, .mm-c-pwm.mm-rm { border-color: rgba(255, 255, 255, 0.8); }

        .mm-pull {
            display: inline-flex; align-items: center;
            height: 18px; padding: 0 6px; flex-shrink: 0;
            border: 1px solid var(--text-accent, #4ecdc4);
            border-radius: 9px;
            color: var(--text-accent, #4ecdc4);
            font: 600 10px var(--font-family-mono, monospace);
            font-style: normal;
            white-space: nowrap;
        }
        .mm-line { flex: 1; min-width: 6px; height: 1px; background: var(--text-muted, #6a7a7a); opacity: 0.5; }
                .mm-num {
            min-width: 40px; height: 24px; padding: 0 6px; flex-shrink: 0;
            display: inline-flex; align-items: center; justify-content: center;
            border-radius: 4px;
            background: var(--bg-primary, #0a0f0f);
            border: 2px solid var(--text-accent, #4ecdc4);
            color: var(--text-primary, #e8f0f0);
            font: 700 14px var(--font-family-mono, monospace);
            font-style: normal;
        }
        .mm-num.mm-num-x { border-color: var(--color-primary, #2d5a5a); color: var(--text-secondary, #a8b5b5); font-size: 11px; }
        .mm-note { font-size: var(--font-size-xs, 0.75rem); color: var(--text-muted, #6a7a7a); }

        /* ----- Schéma (mode large) ----- */
        .mm-view {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 130px minmax(0, 1fr);
            align-items: start;
        }
        .mm-side-title { display: none; }
        .mm-side { padding-top: 44px; }
        .mm-rows { display: flex; flex-direction: column; }
        .mm-row {
            display: flex; align-items: center; gap: 5px;
            height: 30px; padding: 0 2px;
            border: 1px solid transparent; border-radius: 4px;
            cursor: pointer;
            transition: opacity var(--transition-fast, 150ms ease), border-color var(--transition-fast, 150ms ease);
        }
        .mm-side-right .mm-row { flex-direction: row-reverse; }
        .mm-row:hover { border-color: var(--text-accent, #4ecdc4); }
        .mm-row:focus-visible { outline: 2px solid var(--text-accent, #4ecdc4); }
        .mm-row.sel { border-color: var(--color-accent, #e67e22); box-shadow: 0 0 0 1px var(--color-accent, #e67e22); }
        .mm-row.mm-dim { opacity: 0.18; }
        .mm-boardcol { color: var(--text-muted, #6a7a7a); }
        .mm-boardcol svg { display: block; }  /* largeur / hauteur fixées par le script selon le nombre de rangées */

        .mm-aux { display: flex; justify-content: space-between; gap: var(--spacing-md, 16px); margin-top: var(--spacing-md, 16px); flex-wrap: wrap; }
        .mm-auxitem { display: flex; align-items: center; gap: 8px; }
        .mm-hint { margin-top: var(--spacing-md, 16px); font-size: var(--font-size-xs, 0.75rem); color: var(--text-muted, #6a7a7a); }
        .mm-legend { display: flex; flex-wrap: wrap; gap: 6px var(--spacing-md, 16px); margin-top: var(--spacing-sm, 8px); font-size: var(--font-size-xs, 0.75rem); color: var(--text-secondary, #a8b5b5); }
        .mm-legend span { display: inline-flex; align-items: center; gap: 6px; }

        /* ----- Schéma (mode empilé : écrans étroits) ----- */
        .mm-view.mm-stack { display: block; }
        .mm-stack .mm-boardcol { display: none; }
        .mm-stack .mm-side { padding-top: 0; margin-bottom: var(--spacing-lg, 24px); }
        .mm-stack .mm-side-title { display: block; margin-bottom: var(--spacing-sm, 8px); font-weight: 600; color: var(--text-primary, #e8f0f0); }
        .mm-stack .mm-row,
        .mm-stack .mm-side-right .mm-row { flex-direction: row; flex-wrap: wrap; height: auto; min-height: 34px; padding: 4px 2px; border-bottom: 1px solid var(--bg-tertiary, #1a2424); }
        .mm-stack .mm-line { display: none; }
        .mm-stack .mm-num { order: -3; }
        .mm-stack .mm-cs { flex-wrap: wrap; }

        /* ----- Détail ----- */
        .mm-d-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--spacing-md, 16px); margin-bottom: var(--spacing-md, 16px); }
        .mm-d-title { font-family: var(--font-family-mono, monospace); font-size: var(--font-size-xl, 1.5rem); font-weight: 700; color: var(--text-primary, #e8f0f0); }
        .mm-d-sub { color: var(--text-muted, #6a7a7a); font-family: var(--font-family-mono, monospace); }
        .mm-d-grid { display: grid; grid-template-columns: 160px 1fr; gap: var(--spacing-sm, 8px) var(--spacing-md, 16px); }
        .mm-d-grid dt { color: var(--text-muted, #6a7a7a); font-size: var(--font-size-sm, 0.875rem); }
        .mm-d-grid dd { margin: 0; color: var(--text-secondary, #a8b5b5); }
        .mm-tag {
            display: inline-block; margin: 0 4px 4px 0; padding: 2px 8px;
            border-radius: var(--border-radius-sm, 4px);
            background: var(--bg-tertiary, #1a2424);
            border: 1px solid var(--color-primary, #2d5a5a);
            color: var(--text-accent, #4ecdc4);
            font-family: var(--font-family-mono, monospace);
            font-size: var(--font-size-xs, 0.75rem);
        }
        .mm-tag.remap { color: var(--text-secondary, #a8b5b5); border-style: dashed; }

        /* ----- Tableau ----- */
        .mm-table-wrap { overflow-x: auto; }
        .mm-table { width: 100%; font-size: var(--font-size-sm, 0.875rem); }
        .mm-table th, .mm-table td {
            padding: 6px 10px;
            border-bottom: 1px solid var(--bg-tertiary, #1a2424);
            text-align: left; vertical-align: top;
            color: var(--text-secondary, #a8b5b5);
        }
        .mm-table th { color: var(--text-primary, #e8f0f0); font-weight: 600; white-space: nowrap; }
        .mm-table tbody tr { cursor: pointer; }
        .mm-table tbody tr:hover { background: var(--bg-tertiary, #1a2424); }
        .mm-table tbody tr.sel { background: var(--bg-tertiary, #1a2424); outline: 1px solid var(--color-accent, #e67e22); }
        .mm-table td.mono { font-family: var(--font-family-mono, monospace); color: var(--text-primary, #e8f0f0); white-space: nowrap; }
        .mm-table td.fn { font-family: var(--font-family-mono, monospace); font-size: var(--font-size-xs, 0.75rem); min-width: 200px; }
        .mm-foot { margin: var(--spacing-md, 16px) 0 0; font-size: var(--font-size-xs, 0.75rem); color: var(--text-muted, #6a7a7a); }

        @media (max-width: 700px) {
            .mm-d-grid { grid-template-columns: 1fr; }
            .mm-d-grid dt { margin-top: var(--spacing-sm, 8px); }
        }

        .mm-pt.nc { background: #3a4242; color: #aab4b4; border: 1px solid #556; }
        .mm-pt.sig { background: #6b4fa0; }
        .mm-picker .mm-chips { margin-top: 0; }
        .mm-board-btn { display: inline-flex; flex-direction: column; align-items: flex-start; gap: 0; padding: 6px 14px; border-radius: 10px; text-align: left; line-height: 1.2; }
        .mm-board-btn b { font-size: var(--font-size-sm, 0.875rem); font-weight: 700; }
        .mm-board-btn small { font-size: 10px; opacity: 0.75; font-family: var(--font-family-mono, monospace); }
        .mm-picker-note { margin-top: var(--spacing-sm, 8px); font-size: var(--font-size-xs, 0.75rem); color: var(--text-muted, #6a7a7a); }
    </style>

    <!-- Script de la page : DONNÉES par carte puis MOTEUR (identique au gabarit, rendu rejouable) -->
    <script>
        (function () {
            const root = document.getElementById('mm-root');
            if (!root) return;

            const g = (s, r, l, p, f, m, ft, n, rs, al, x, pl) =>
                ({ s, r, l, p, t: 'gpio', f, m: m || [], ft, n: n || '', rs: rs || '', al: al || '', x: x || [], pl: pl || 'both' });
            const pw = (s, r, l, sh, n, gnd, disp, kind) =>
                ({ s, r, l, p: sh, sh, t: 'pwr', f: [], m: [], ft: null, n, gnd: !!gnd, disp: disp || l, kind: kind || (gnd ? 'gnd' : 'pwr'), al: '', x: [], rs: '' });
            const rst = (s, r, l, p, n, disp) =>
                ({ s, r, l, p, t: 'rst', f: [], m: [], ft: false, n: n || '', disp: disp || 'RESET', al: '', x: [], rs: '' });
            const BOARDS = {};
        BOARDS["uno-r3"] = { label: "Uno R3", mcu: "ATmega328P", build: function () {
            const CONFIG = {
              "board": {
                "name": "Arduino Uno R3",
                "color": "#00878f",
                "stroke": "#005b61",
                "textColor": "#bfe9ec",
                "usb": true,
                "chip": [
                  "ATmega",
                  "328P"
                ],
                "crystal": "16 MHz",
                "buttons": [
                  {
                    "x": 65,
                    "label": "RESET"
                  }
                ],
                "extraSvg": ""
              },
              "badges": [
                [
                  "primary",
                  "Électronique"
                ],
                [
                  "secondary",
                  "Microcontrôleur"
                ],
                [
                  "accent",
                  "AVR"
                ]
              ],
              "text": {
                "title": "Arduino Uno R3",
                "subtitle": "Brochage ATmega328P",
                "lead": "Vue de la carte <strong>Arduino Uno R3</strong> (ATmega328P, logique <strong>5 V</strong>) : chaque broche est repérée par le <strong>numéro imprimé sur la carte</strong>, avec le port du microcontrôleur, les fonctions et la pull-up interne activable. Clique sur une broche pour le détail.",
                "sideLeft": "Rangée gauche · en-têtes alimentation et A0 → A5",
                "sideRight": "Rangée droite · SCL, SDA, AREF, GND, 13 → 8 puis 7 → 0",
                "hint": "Vue de dessus, USB en haut (la carte est tournée d'un quart de tour par rapport à la vue habituelle). Le <strong>numéro dans le cadre</strong>, collé à la carte, est celui imprimé dessus. Les trous correspondent aux espaces entre en-têtes.",
                "foot": "Les broches AVR n'ont pas de remap : chaque fonction est fixe. Chaque broche I/O a aussi une interruption de changement de niveau (PCINT). « PU » = pull-up interne ≈ 20–50 kΩ, activée par logiciel (<code>INPUT_PULLUP</code>) ; il n'existe pas de pull-down interne.",
                "searchPlaceholder": "Rechercher : 13, PB5, SPI, OC2B, INT0…"
              },
              "aux": [
                {
                  "side": "L",
                  "port": "ICSP",
                  "chip": "6 broches",
                  "cls": "misc",
                  "note": "MISO, 5V, SCK, MOSI, RESET, GND (en-tête 2×3, recopie des broches SPI)"
                },
                {
                  "side": "R",
                  "port": "PB5",
                  "chip": "LED L",
                  "cls": "btn",
                  "note": "LED « L » sur D13"
                }
              ],
              "legend": [
                "<i class=\"mm-lv mm-lv5 mm-inl\">5</i> logique 5 V",
                "<i class=\"mm-pull mm-inl\">PU</i> pull-up interne activable",
                "<i class=\"mm-pull mm-inl\">PU fixe</i> pull-up de reset non configurable",
                "<i class=\"mm-num mm-inl\">13</i> numéro imprimé sur la carte",
                "<i class=\"mm-c mm-c-al mm-inl\">D14</i> équivalent numérique d'une entrée analogique"
              ],
              "cards": [
                {
                  "kind": "warning",
                  "html": "<strong>À savoir :</strong><ul><li>Toutes les E/S sont en <strong>5 V</strong> : un signal 3,3 V est lu comme niveau haut dès ≈ 3 V (0,6 × VCC), mais une sortie 5 V détruit une entrée 3,3 V.</li><li>Courant par broche : 20 mA conseillé, 40 mA maximum absolu ; environ 200 mA au total sur VCC / GND pour l'ATmega328P.</li><li>D0 / D1 sont reliées à l'ATmega16U2 (liaison USB-série) : un montage branché dessus gêne le téléversement.</li><li>Entrées A0–A5 : en entrée analogique, ne pas dépasser VCC ; les sorties PWM (~) sont D3, D5, D6, D9, D10, D11.</li></ul>"
                },
                {
                  "kind": "info",
                  "html": "<strong>Sources &amp; vérification :</strong> ports, timers et numéros d'après le cœur <em>ArduinoCore-avr</em> (variant <code>standard</code>) ; fonctions d'après la datasheet de l'ATmega328P ; ordre des en-têtes d'après la disposition standard de l'Uno R3. Les révisions et clones (CH340, SMD) ont la même disposition mais peuvent différer par l'USB-série."
                }
              ],
              "silk": {
                "re": "^(D\\d+|A\\d+)$",
                "strip": "^D"
              },
              "portFmt": null,
              "cats": [
                [
                  "all",
                  "Tout"
                ],
                [
                  "ADC",
                  "ADC"
                ],
                [
                  "UART",
                  "UART"
                ],
                [
                  "SPI",
                  "SPI"
                ],
                [
                  "I2C",
                  "I2C"
                ],
                [
                  "TIM",
                  "PWM / Timers"
                ],
                [
                  "INT",
                  "Interruptions"
                ],
                [
                  "PWR",
                  "Alim"
                ]
              ],
              "catRe": {
                "ADC": "^ADC",
                "UART": "^(RXD|TXD|XCK)",
                "SPI": "^(MOSI|MISO|SCK|SS)$",
                "I2C": "^(SDA|SCL)$",
                "TIM": "^(OC\\d|T\\d$|ICP)",
                "INT": "^INT\\d"
              },
              "funcMap": [
                {
                  "re": "^ADC\\d+$",
                  "t": "Analog In",
                  "c": "an",
                  "once": true
                },
                {
                  "re": "^RXD(\\d)$",
                  "t": "UART$1 RX",
                  "c": "ser"
                },
                {
                  "re": "^TXD(\\d)$",
                  "t": "UART$1 TX",
                  "c": "ser"
                },
                {
                  "re": "^(SDA|SCL)$",
                  "t": "I2C $1",
                  "c": "i2c"
                },
                {
                  "re": "^(MOSI|MISO|SCK|SS)$",
                  "t": "SPI $1",
                  "c": "spi"
                },
                {
                  "re": "^OC(\\d)([A-D])$",
                  "t": "PWM$1$2",
                  "c": "pwm"
                },
                {
                  "re": "^INT(\\d)$",
                  "t": "INT$1",
                  "c": "misc"
                },
                {
                  "re": "^(TCK|TMS|TDO|TDI)$",
                  "t": "JTAG $1",

                    '<td>' + pullShort(p) + '</td>' +
                    '<td>' + levelBadge(p) + '</td>';
                tr.addEventListener('click', () => select(i));
                tbody.appendChild(tr);
            });

            // ----- Détail -----
            const detail = $('mm-detail');
            detail.innerHTML = '<p class="text-muted" style="margin:0;">Sélectionne une broche dans le schéma ou dans le tableau.</p>';
            const view = $('mm-view');
            function select(i) {
                state.sel = i;
                const p = pins[i];
                const tags = p.f.map(f => '<span class="mm-tag">' + f + '</span>').join('') +
                    p.m.map(f => '<span class="mm-tag remap">' + f + ' (remap)</span>').join('');
                let html =
                    '<div class="mm-d-head"><span class="mm-d-title">' + (isNum(p) ? 'Broche ' : '') + numText(p) + '</span>' +
                    '<span class="mm-d-sub">' + (p.t === 'pwr' ? 'Alimentation' : p.mb + ' (' + p.p + ')') + '</span></div>' +
                    '<dl class="mm-d-grid">' +
                    '<dt>Sur la carte</dt><dd>' + numText(p) + ' — rangée ' + (p.s === 'L' ? 'gauche' : 'droite') + ', ' + p.r + T.posSuffix + '</dd>';
                if (p.al) html += '<dt>' + T.aliasLabel + '</dt><dd>' + p.al + '</dd>';
                if (tags) html += '<dt>Fonctions</dt><dd>' + tags + '</dd>';
                html += '<dt>Pull-up / pull-down</dt><dd>' + pullText(p) + '</dd>';
                if (p.t === 'gpio') html += '<dt>État au reset</dt><dd>' + p.rs + '</dd>';
                html += '<dt>Niveau logique</dt><dd>' + dotHTML(p) + levelText(p) + '</dd>';
                if (p.n) html += '<dt>Remarque</dt><dd>' + p.n + '</dd>';
                html += '</dl>';
                detail.innerHTML = html;
                refresh();
                const card = $('mm-detail-card');
                if (card && view.classList.contains('mm-stack') && card.scrollIntoView) card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }

            // ----- Filtres -----
            function matches(p) {
                if (state.cat !== 'all') {
                    if (state.cat === 'FT') { if (p.ft !== true) return false; }
                    else if (state.cat === 'V3') { if (p.t === 'pwr' || p.ft !== false) return false; }
                    else if (state.cat === 'PWR') { if (p.t !== 'pwr') return false; }
                    else if (!allFuncs(p).some(f => CAT_RE[state.cat].test(f))) return false;
                }
                if (state.q) {
                    if (/^\d+$/.test(state.q)) return numText(p).toLowerCase() === state.q;
                    const hay = (p.l + ' ' + p.p + ' ' + p.mb + ' ' + p.al + ' ' + allFuncs(p).join(' ') + ' ' + p.n).toLowerCase();
                    if (hay.indexOf(state.q) === -1) return false;
                }
                return true;
            }

            const chipsEl = $('mm-chips');
            chipsEl.innerHTML = '';
            CATS.forEach(([key, label]) => {
                const b = document.createElement('button');
                b.type = 'button';
                b.className = 'mm-chip-btn' + (key === 'all' ? ' active' : '');
                b.textContent = label;
                b.addEventListener('click', () => {
                    state.cat = key;
                    chipsEl.querySelectorAll('.mm-chip-btn').forEach(c => c.classList.toggle('active', c === b));
                    refresh();
                });
                chipsEl.appendChild(b);
            });
            $('mm-search').value = '';
            $('mm-search').oninput = e => {
                state.q = e.target.value.trim().toLowerCase();
                refresh();
            };

            function refresh() {
                let shown = 0;
                root.querySelectorAll('.mm-row').forEach(el => {
                    const i = +el.dataset.i;
                    const ok = matches(pins[i]);
                    el.classList.toggle('mm-dim', !ok);
                    el.classList.toggle('sel', i === state.sel);
                    if (ok) shown++;
                });
                tbody.querySelectorAll('tr').forEach(tr => {
                    const i = +tr.dataset.i;
                    tr.style.display = matches(pins[i]) ? '' : 'none';
                    tr.classList.toggle('sel', i === state.sel);
                });
                $('mm-count').textContent = shown + ' / ' + pins.length + ' broches correspondent';
            }

            // ----- Mise en page adaptative : schéma large ou liste empilée -----
            function layout() {
                const w = root.getBoundingClientRect().width;
                if (!w) return;
                view.classList.toggle('mm-stack', w < 940);
            }
            layoutFn = layout;
            if (ro) ro.disconnect();
            if (window.ResizeObserver) { ro = new ResizeObserver(layout); ro.observe(root); }

            layout();
            refresh();

            }

            // ----- Sélecteur de carte -----
            const keys = Object.keys(BOARDS);
            const pick = document.getElementById('mm-boards');
            keys.forEach(function (k) {
                const b = document.createElement('button');
                b.type = 'button';
                b.className = 'mm-chip-btn mm-board-btn';
                b.dataset.key = k;
                b.innerHTML = '<b></b><small></small>';
                b.firstChild.textContent = BOARDS[k].label;
                b.lastChild.textContent = BOARDS[k].mcu;
                b.addEventListener('click', function () { show(k); });
                pick.appendChild(b);
            });
            function show(k) {
                if (!BOARDS[k]) k = keys[0];
                pick.querySelectorAll('.mm-board-btn').forEach(function (c) { c.classList.toggle('active', c.dataset.key === k); });
                const r = BOARDS[k].build();
                mount(r.CONFIG, r.pins);
                try { history.replaceState(null, '', '#' + k); } catch (err) { /* page intégrée : pas de hash */ }
                try { window.__mmCurrent = k; } catch (err) {}
            }
            window.addEventListener('hashchange', function () { show(location.hash.replace('#', '')); });
            show(location.hash.replace('#', '') || keys[0]);
        })();
    </script>
    </div>
</body>
</html>
