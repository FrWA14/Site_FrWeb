<!DOCTYPE html>
<html lang="fr">
<head>

    <meta name="description" content="Brochage interactif des cartes ESP32-H2 (DevKitM-1) et ESP32-P4 (Function EV Board) : GPIO, USB, strapping, en-tête J1.">

<body>
    <div class="page-content">

                            <tbody id="mm-tbody"></tbody>

                    </div>
                    <p class="mm-foot" data-cfg="foot"></p>
                </div>

        <p class="text-center">

            font-style: normal;
        }
        .mm-lv5 { background: #2ecc71; color: #05210f; }
        .mm-lv3 { background: #e74c3c; color: #fff; }
        .mm-lv0 { background: transparent; }
        .mm-inl { vertical-align: middle; margin: 0 2px; }

        .mm-pt {
            display: inline-flex; align-items: center; justify-content: center;

            color: #fff;

        .mm-c-pwm  { background: #5b3a99; color: #fff; }

            border-radius: 9px;
            color: var(--text-accent, #4ecdc4);
            font: 600 10px var(--font-family-mono, monospace);
            font-style: normal;
            white-space: nowrap;
        }
        .mm-line { flex: 1; min-width: 6px; height: 1px; background: var(--text-muted, #6a7a7a); opacity: 0.5; }
                .mm-num {
            min-width: 40px; height: 24px; padding: 0 6px; flex-shrink: 0;
            display: inline-flex; align-items: center; justify-content: center;
            border-radius: 4px;
            background: var(--bg-primary, #0a0f0f);
            border: 2px solid var(--text-accent, #4ecdc4);
            color: var(--text-primary, #e8f0f0);
            font: 700 14px var(--font-family-mono, monospace);
            font-style: normal;

            transition: opacity var(--transition-fast, 150ms ease), border-color var(--transition-fast, 150ms ease);

        .mm-side-right .mm-row { flex-direction: row-reverse; }
        .mm-row:hover { border-color: var(--text-accent, #4ecdc4); }
        .mm-row:focus-visible { outline: 2px solid var(--text-accent, #4ecdc4); }
        .mm-row.sel { border-color: var(--color-accent, #e67e22); box-shadow: 0 0 0 1px var(--color-accent, #e67e22); }

        .mm-boardcol { color: var(--text-muted, #6a7a7a); }
        .mm-boardcol svg { display: block; }  /* largeur / hauteur fixées par le script selon le nombre de rangées */

        .mm-aux { display: flex; justify-content: space-between; gap: var(--spacing-md, 16px); margin-top: var(--spacing-md, 16px); flex-wrap: wrap; }
        .mm-auxitem { display: flex; align-items: center; gap: 8px; }
        .mm-hint { margin-top: var(--spacing-md, 16px); font-size: var(--font-size-xs, 0.75rem); color: var(--text-muted, #6a7a7a); }
        .mm-legend { display: flex; flex-wrap: wrap; gap: 6px var(--spacing-md, 16px); margin-top: var(--spacing-sm, 8px); font-size: var(--font-size-xs, 0.75rem); color: var(--text-secondary, #a8b5b5); }

        .mm-view.mm-stack { display: block; }
        .mm-stack .mm-boardcol { display: none; }
        .mm-stack .mm-side { padding-top: 0; margin-bottom: var(--spacing-lg, 24px); }
        .mm-stack .mm-side-title { display: block; margin-bottom: var(--spacing-sm, 8px); font-weight: 600; color: var(--text-primary, #e8f0f0); }

        .mm-stack .mm-num { order: -3; }

            background: var(--bg-tertiary, #1a2424);
            border: 1px solid var(--color-primary, #2d5a5a);
            color: var(--text-accent, #4ecdc4);
            font-family: var(--font-family-mono, monospace);
            font-size: var(--font-size-xs, 0.75rem);
        }
        .mm-tag.remap { color: var(--text-secondary, #a8b5b5); border-style: dashed; }

        /* ----- Tableau ----- */
        .mm-table-wrap { overflow-x: auto; }
        .mm-table { width: 100%; font-size: var(--font-size-sm, 0.875rem); }
        .mm-table th, .mm-table td {
            padding: 6px 10px;
            border-bottom: 1px solid var(--bg-tertiary, #1a2424);
            text-align: left; vertical-align: top;
            color: var(--text-secondary, #a8b5b5);
        }
        .mm-table th { color: var(--text-primary, #e8f0f0); font-weight: 600; white-space: nowrap; }
        .mm-table tbody tr { cursor: pointer; }
        .mm-table tbody tr:hover { background: var(--bg-tertiary, #1a2424); }
        .mm-table tbody tr.sel { background: var(--bg-tertiary, #1a2424); outline: 1px solid var(--color-accent, #e67e22); }
        .mm-table td.mono { font-family: var(--font-family-mono, monospace); color: var(--text-primary, #e8f0f0); white-space: nowrap; }
        .mm-table td.fn { font-family: var(--font-family-mono, monospace); font-size: var(--font-size-xs, 0.75rem); min-width: 200px; }
        .mm-foot { margin: var(--spacing-md, 16px) 0 0; font-size: var(--font-size-xs, 0.75rem); color: var(--text-muted, #6a7a7a); }

        @media (max-width: 700px) {
            .mm-d-grid { grid-template-columns: 1fr; }
            .mm-d-grid dt { margin-top: var(--spacing-sm, 8px); }

        .mm-var-card .card-body { padding-bottom: var(--spacing-md, 16px); }
        .mm-variants { display: flex; flex-wrap: wrap; gap: var(--spacing-xs, 4px); }

        .mm-tag.strap { border-color: #bfe3ff; color: #bfe3ff; }
        .mm-ver { display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 9px; font-size: 10px; font-weight: 700; vertical-align: middle; }

</style>

    // ==================================================================
    // MOTEUR — identique pour toutes les pages (gabarit + sélecteur de variante)
    // ==================================================================
    const T = CONFIG.texts;
    const $ = id => document.getElementById(id);
    const page = root.closest('.page-content') || document;
    const FLOAT = T.float;
    const state = { q: '', cat: 'all', sel: -1, v: 0 };
    let pins = [], ROWS = 0, cur = null, silkRe = null, silkStrip = null;
    const dyn = [];

    const CAT_RE = {};
    Object.keys(CONFIG.catRe).forEach(k => { CAT_RE[k] = new RegExp(CONFIG.catRe[k]); });
    const FUNC_MAP = CONFIG.funcMap.map(m => ({ re: new RegExp(m.re), t: m.t, c: m.c, once: !!m.once }));
    const allFuncs = p => p.f.concat(p.m);
    const isNum = p => silkRe.test(p.l);
    const numText = p => (isNum(p) && silkStrip) ? p.l.replace(silkStrip, '') : p.l;
    const plOf = p => p.pl || 'both';
    const PULL_TXT = { both: T.pullBoth, up: T.pullUp, down: T.pullDown, none: T.pullNone };
    const PULL_TAG = { both: 'PU/PD', up: 'PU', down: 'PD', none: '' };
    const PULL_SHORT = { both: 'PU / PD', up: 'PU', down: 'PD', none: 'aucune' };

    // ----- Éléments statiques de la page -----
    $('mm-badges').innerHTML = CONFIG.badges.map(b => '<span class="badge badge-' + b[0] + '">' + b[1] + '</span>').join('\n');
    $('mm-legend').innerHTML = CONFIG.legend.map(h => '<span>' + h + '</span>').join('');
    page.querySelectorAll('[data-cfg="title"]').forEach(el => { el.innerHTML = CONFIG.text.title; });
    page.querySelectorAll('[data-cfg="lead"]').forEach(el => { el.innerHTML = CONFIG.text.lead; });

    // ----- Puces de fonctions -----
    function chipsFor(p) {
        const out = [];
        if (p.al) out.push({ t: p.al, c: 'al' });
        p.x.forEach(x => out.push({ t: x[0], c: x[1] }));
        const add = (arr, rm) => {
            arr.forEach(f => {
                const m = FUNC_MAP.find(e => e.re.test(f));
                if (!m) return;
                const t = f.replace(m.re, m.t);
                if (m.once && out.some(o => o.t === t && o.c === m.c)) return;
                out.push({ t, c: m.c, rm });
            });
        };
        add(p.f, false);
        add(p.m, true);
        return out;
    }
    function pullTag(p) {
        if (p.t === 'pwr') return '';
        if (p.t === 'rst') return T.rstTag ? '<i class="mm-pull" title="' + T.rstTip + '">' + T.rstTag + '</i>' : '';
        const base = PULL_TAG[plOf(p)];
        if (!base) return '';
        const arrow = /^Pull-up/.test(p.rs) ? ' ↑' : (/^Pull-down/.test(p.rs) ? ' ↓' : '');
        const tip = PULL_TXT[plOf(p)] + (p.rs !== FLOAT ? ' · État au reset : ' + p.rs : '');
        return '<i class="mm-pull" title="' + tip + '">' + base + arrow + '</i>';
    }
    function dotHTML(p) {
        const col = p.t === 'pwr' ? (p.gnd ? '#6a7a7a' : '#e74c3c') : (p.ft ? '#2ecc71' : '#e74c3c');
        return '<i style="display:inline-block;width:10px;height:10px;border-radius:50%;background:' + col + ';vertical-align:middle;margin-right:4px"></i>';
    }
    function rowHTML(p) {
        const MAXC = 4;
        const chips = chipsFor(p);
        const shown = chips.slice(0, MAXC);
        const hidden = chips.slice(MAXC);
        let cs = shown.map(c => '<span class="mm-c mm-c-' + c.c + (c.rm ? ' mm-rm' : '') + '"' +
            (c.rm ? ' title="Fonction alternative"' : '') + '>' + c.t + '</span>').join('');
        if (hidden.length) cs += '<span class="mm-c mm-c-misc" title="' + hidden.map(c => c.t).join(', ') + '">+' + hidden.length + '</span>';
        const lv = p.t === 'pwr' ? '<span class="mm-lv mm-lv0"></span>'
            : '<span class="mm-lv ' + (p.ft ? 'mm-lv5' : 'mm-lv3') + '" title="' + (p.ft ? T.ftShort : T.v3Short) + '">' + (p.ft ? '5' : '3') + '</span>';
        const ptCls = p.t === 'pwr' ? p.kind : (p.t === 'rst' ? 'rst' : 'io');
        return lv +
            '<span class="mm-pt ' + ptCls + '">' + p.mb + '</span>' +
            '<span class="mm-cs">' + cs + pullTag(p) + '</span>' +
            '<span class="mm-line"></span>' +
            '<span class="mm-num' + (isNum(p) ? '' : ' mm-num-x') + '" title="Repère : ' + p.l + '">' + numText(p) + '</span>';
    }
    function levelText(p) {
        if (p.t === 'pwr') return p.kind === 'nc' ? 'Non connectée' : (p.gnd ? 'Masse (0 V)' : 'Alimentation : ' + p.sh);
        if (p.t === 'rst') return T.rstLevel;
        return p.ft ? T.ft : T.v3;
    }
    function pullText(p) {
        if (p.t === 'pwr') return 'Sans objet';
        if (p.t === 'rst') return T.rstTip;
        return PULL_TXT[plOf(p)];
    }
    function levelBadge(p) {
        if (p.t === 'pwr') return '<span class="badge badge-secondary">' + p.sh + '</span>';
        if (p.t === 'rst') return '<span class="badge badge-warning">3,3 V</span>';
        return p.ft ? '<span class="badge badge-success">5 V ✔</span>' : '<span class="badge badge-warning">3,3 V</span>';
    }
    function pullShort(p) {
        if (p.t === 'pwr') return '—';
        if (p.t === 'rst') return T.rstTag || '—';
        return PULL_SHORT[plOf(p)] + (plOf(p) !== 'none' && p.rs !== FLOAT ? ' (reset : ' + p.rs.replace(/ \(.*\)/, '').toLowerCase() + ')' : '');
    }

    // ----- Carte (SVG central) -----
    function drawBoard() {
        const B = cur.board;
        const Y0 = 44, H = 30;
        const SH = Y0 + H * ROWS + 8;
        const PH = H * ROWS + 12;
        const compact = ROWS < 10;
        const chipY = compact ? Math.max(Y0, 34 + Math.round((PH - 34) / 2) - 6) : 130;
        const nameY = compact ? 34 + PH - 8 : 262;
        const tx = B.textColor;
        let s = '<svg viewBox="0 0 130 ' + SH + '" width="130" height="' + SH + '" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="' + B.name + '">';
        s += '<rect x="28" y="34" width="74" height="' + PH + '" rx="6" fill="' + B.color + '" stroke="' + B.stroke + '" stroke-width="2"/>';
        if (B.usb) {
            s += '<rect x="46" y="4" width="38" height="36" rx="3" fill="#c9cfd2" stroke="#7b8488" stroke-width="2"/>';
            s += '<rect x="53" y="12" width="24" height="10" rx="1" fill="#5a6266"/>';
        }
        if (B.chip && B.chip.length) {
            s += '<rect x="48" y="' + chipY + '" width="34" height="34" rx="2" fill="#15181a" stroke="#4ecdc4" stroke-width="1"/>';
            B.chip.forEach((line, i) => {
                s += '<text x="65" y="' + (chipY + 15 + 9 * i) + '" text-anchor="middle" font-size="6" fill="#4ecdc4" font-family="monospace">' + line + '</text>';
            });
        }
        if (B.crystal && !compact) {
            s += '<rect x="56" y="200" width="18" height="8" rx="4" fill="#d9d9d9" stroke="#7b8488"/>';
            s += '<text x="65" y="222" text-anchor="middle" font-size="6" fill="' + tx + '" font-family="monospace">' + B.crystal + '</text>';
        }
        s += '<text x="65" y="' + nameY + '" text-anchor="middle" font-size="' + (B.name.length > 14 ? 7 : 9) + '" fill="' + tx + '" font-family="sans-serif" font-weight="700">' + B.name + '</text>';
        const by = SH - 92;
        (B.buttons || []).forEach(b => {
            const y = (b.y != null) ? b.y : by;
            s += '<circle cx="' + b.x + '" cy="' + y + '" r="6" fill="#222" stroke="#999"/><text x="' + b.x + '" y="' + (y + 18) + '" text-anchor="middle" font-size="6" fill="' + tx + '" font-family="monospace">' + b.label + '</text>';
        });
        s += (B.extraSvg || '').replace(/__SH__/g, SH);
        for (let i = 0; i < ROWS; i++) {
            const y = Y0 + H * i + H / 2;
            s += '<line x1="0" y1="' + y + '" x2="34" y2="' + y + '" stroke="currentColor" stroke-opacity="0.5"/>';
            s += '<line x1="96" y1="' + y + '" x2="130" y2="' + y + '" stroke="currentColor" stroke-opacity="0.5"/>';
            s += '<circle cx="35" cy="' + y + '" r="3.2" fill="#d4af37"/><circle cx="95" cy="' + y + '" r="3.2" fill="#d4af37"/>';
        }
        s += '</svg>';
        $('mm-boardsvg').innerHTML = s;
    }

    // ----- Rangées / tableau / détail -----
    const leftEl = $('mm-left'), rightEl = $('mm-right'), tbody = $('mm-tbody'), detail = $('mm-detail'), view = $('mm-view');

    function buildRows() {
        leftEl.innerHTML = ''; rightEl.innerHTML = ''; tbody.innerHTML = '';
        const nextRank = { L: 1, R: 1 };
        pins.forEach((p, i) => {
            for (; nextRank[p.s] < p.r; nextRank[p.s]++) {
                const gap = document.createElement('div');
                gap.style.height = '30px';
                (p.s === 'L' ? leftEl : rightEl).appendChild(gap);
            }
            nextRank[p.s] = p.r + 1;
            const row = document.createElement('div');
            row.className = 'mm-row';
            row.dataset.i = i;
            row.tabIndex = 0;
            row.setAttribute('role', 'button');
            row.setAttribute('aria-label', 'Broche ' + numText(p) + ' ' + p.mb);
            row.innerHTML = rowHTML(p);
            row.addEventListener('click', () => select(i));
            row.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); select(i); } });
            (p.s === 'L' ? leftEl : rightEl).appendChild(row);

            const tr = document.createElement('tr');
            tr.dataset.i = i;
            const fn = p.f.concat(p.m.map(f => f + '*')).join(', ') || '—';
            tr.innerHTML =
                '<td class="mono">' + numText(p) + '</td>' +
                '<td>' + (p.s === 'L' ? 'G' : 'D') + '</td>' +
                '<td class="mono">' + (p.al || '—') + '</td>' +
                '<td class="mono">' + (p.t === 'pwr' ? '—' : p.mb) + '</td>' +
                '<td class="fn">' + fn + '</td>' +
                '<td>' + pullShort(p) + '</td>' +
                '<td>' + levelBadge(p) + '</td>';
            tr.addEventListener('click', () => select(i));
            tbody.appendChild(tr);
        });
    }

    function select(i) {
        state.sel = i;
        const p = pins[i];
        const tags = p.f.map(f => '<span class="mm-tag">' + f + '</span>').join('') +
            p.m.map(f => '<span class="mm-tag remap">' + f + ' (alt.)</span>').join('');
        let html =
            '<div class="mm-d-head"><span class="mm-d-title">' + (isNum(p) ? 'Broche ' : '') + numText(p) + '</span>' +
            '<span class="mm-d-sub">' + (p.t === 'pwr' ? 'Alimentation' : p.mb + ' (' + p.p + ')') + '</span></div>' +
            '<dl class="mm-d-grid">' +
            '<dt>Sur la carte</dt><dd>' + numText(p) + ' — rangée ' + (p.s === 'L' ? 'gauche' : 'droite') + ', ' + p.r + T.posSuffix + '</dd>';
        if (p.al) html += '<dt>' + T.aliasLabel + '</dt><dd>' + p.al + '</dd>';
        if (tags) html += '<dt>Fonctions</dt><dd>' + tags + '</dd>';
        if (p.strap) html += '<dt>Strapping</dt><dd>Broche lue au reset pour choisir le mode de démarrage : ne pas la forcer.</dd>';
        if (p.rsv) html += '<dt>Réservée</dt><dd>Utilisée en interne par la mémoire flash/PSRAM du module : à éviter.</dd>';
        html += '<dt>Pull-up / pull-down</dt><dd>' + pullText(p) + '</dd>';
        if (p.t === 'gpio') html += '<dt>État au reset</dt><dd>' + p.rs + '</dd>';
        html += '<dt>Niveau logique</dt><dd>' + dotHTML(p) + levelText(p) + '</dd>';
        if (p.n) html += '<dt>Remarque</dt><dd>' + p.n + '</dd>';
        html += '</dl>';
        detail.innerHTML = html;
        refresh();
        const card = $('mm-detail-card');
        if (card && view.classList.contains('mm-stack') && card.scrollIntoView) card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    // ----- Filtres -----
    function matches(p) {
        if (state.cat !== 'all') {
            if (state.cat === 'PWR') { if (p.t !== 'pwr') return false; }
            else if (state.cat === 'STRAP') { if (!p.strap) return false; }
            else if (state.cat === 'RSV') { if (!p.rsv) return false; }
            else if (!allFuncs(p).some(f => CAT_RE[state.cat].test(f))) return false;
        }
        if (state.q) {
            if (/^\d+$/.test(state.q)) return numText(p).toLowerCase() === state.q;
            const hay = (p.l + ' ' + p.p + ' ' + p.mb + ' ' + p.al + ' ' + allFuncs(p).join(' ') + ' ' + p.n).toLowerCase();
            if (hay.indexOf(state.q) === -1) return false;
        }
        return true;
    }
    const chipsEl = $('mm-chips');
    CONFIG.cats.forEach(([key, label]) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'mm-chip-btn' + (key === 'all' ? ' active' : '');
        b.textContent = label;
        b.addEventListener('click', () => {
            state.cat = key;
            chipsEl.querySelectorAll('.mm-chip-btn').forEach(c => c.classList.toggle('active', c === b));
            refresh();
        });
        chipsEl.appendChild(b);
    });
    $('mm-search').addEventListener('input', e => { state.q = e.target.value.trim().toLowerCase(); refresh(); });

    function refresh() {
        let shown = 0;
        root.querySelectorAll('.mm-row').forEach(el => {
            const i = +el.dataset.i;
            const ok = matches(pins[i]);
            el.classList.toggle('mm-dim', !ok);
            el.classList.toggle('sel', i === state.sel);
            if (ok) shown++;
        });
        tbody.querySelectorAll('tr').forEach(tr => {
            const i = +tr.dataset.i;
            tr.style.display = matches(pins[i]) ? '' : 'none';
            tr.classList.toggle('sel', i === state.sel);
        });
        $('mm-count').textContent = shown + ' / ' + pins.length + ' broches correspondent';
    }

    // ----- Sélecteur de variante -----
    const varEl = $('mm-variants');
    VARIANTS.forEach((v, i) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'mm-chip-btn mm-var-btn' + (i === 0 ? ' active' : '');
        b.textContent = v.label;
        b.addEventListener('click', () => load(i));
        varEl.appendChild(b);
    });

    function load(i) {
        state.v = i;
        state.sel = -1;
        cur = VARIANTS[i];
        varEl.querySelectorAll('.mm-var-btn').forEach((c, k) => c.classList.toggle('active', k === i));
        const sk = cur.silk || CONFIG.silk;
        silkRe = new RegExp(sk.re);
        silkStrip = sk.strip ? new RegExp(sk.strip) : null;
        pins = cur.pins.map(p => Object.assign({}, p));
        pins.sort((a, b) => (a.s === b.s ? a.r - b.r : (a.s === 'L' ? -1 : 1)));
        pins.forEach(p => { p.mb = p.t === 'gpio' ? p.p : (p.t === 'rst' ? (p.disp || 'RESET') : p.disp); });
        ROWS = Math.max.apply(null, pins.map(p => p.r));

        const tx = Object.assign({}, CONFIG.text, cur.text || {});
        page.querySelectorAll('[data-cfg]').forEach(el => {
            const k = el.dataset.cfg;
            if (k === 'title' || k === 'lead') return;
            if (tx[k] != null) el.innerHTML = tx[k];
        });
        $('mm-search').placeholder = tx.searchPlaceholder || '';
        $('mm-var-sub').innerHTML = cur.sub || '';

        $('mm-aux').innerHTML = (cur.aux || []).map(a => {
            const pt = '<span class="mm-pt io">' + a.port + '</span>';
            const ch = '<span class="mm-c mm-c-' + a.cls + '">' + a.chip + '</span>';
            const nt = '<span class="mm-note">' + a.note + '</span>';
            return '<div class="mm-auxitem">' + (a.side === 'R' ? nt + ch + pt : pt + ch + nt) + '</div>';
        }).join('');

        dyn.splice(0).forEach(el => el.remove());
        CONFIG.cards.concat(cur.cards || []).forEach(c => {
            const d = document.createElement('div');
            d.className = 'card-alert ' + c.kind;
            d.innerHTML = '<div class="card-body">' + c.html + '</div>';
            root.appendChild(d);
            dyn.push(d);
        });

        drawBoard();
        buildRows();
        detail.innerHTML = '<p class="text-muted" style="margin:0;">Sélectionne une broche dans le schéma ou dans le tableau.</p>';
        layout();
        refresh();
    }

    function layout() {
        const w = root.getBoundingClientRect().width;
        if (!w) return;
        view.classList.toggle('mm-stack', w < 940);
    }
    if (window.ResizeObserver) new ResizeObserver(layout).observe(root);
    window.addEventListener('resize', layout);
    document.addEventListener('contentLoaded', layout);

    load(0);
})();

    </script>
    </div>
</body>
</html>
